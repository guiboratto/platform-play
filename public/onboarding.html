<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Play — Install</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .step {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .step-number {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .step-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .step-desc {
      color: #666;
      font-size: 14px;
    }

    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Platform Play</h1>
    <p class="subtitle">AI-Powered Affiliate Platform</p>

    <div class="step">
      <div class="step-number">1</div>
      <div class="step-title">Connect Telegram</div>
      <div class="step-desc">Login with Telegram to get started</div>
    </div>

    <div class="step">
      <div class="step-number">2</div>
      <div class="step-title">Choose Your Path</div>
      <div class="step-desc">UGC, Affiliate, Freelance, or Micro-tasks</div>
    </div>

    <div class="step">
      <div class="step-number">3</div>
      <div class="step-title">Install Platform</div>
      <div class="step-desc">One-click installation on your device</div>
    </div>

    <div class="step">
      <div class="step-number">4</div>
      <div class="step-title">AI Agent Activates</div>
      <div class="step-desc">Your agent starts earning clicks automatically</div>
    </div>

    <button id="installBtn" class="button" onclick="installPlatform()">
      📥 Install Platform
    </button>

    <div id="status" class="status"></div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Get Telegram user info
      const user = tg.initDataUnsafe?.user;
      const telegramId = tg.initDataUnsafe?.auth_date;

      console.log('Telegram user:', user);

      // Store user data
      localStorage.setItem('telegram_id', telegramId);
      localStorage.setItem('username', user?.username || '');
      localStorage.setItem('first_name', user?.first_name || '');
    }

    async function installPlatform() {
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('installBtn');

      // Show loading
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>Installing...';

      statusEl.className = 'status';
      statusEl.style.display = 'block';
      statusEl.textContent = 'Starting installation...';

      try {
        // Send installation request to backend
        const response = await fetch('/api/install', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            telegram_id: localStorage.getItem('telegram_id'),
            username: localStorage.getItem('username'),
            goal: 'Affiliate', // Default goal
          }),
        });

        if (!response.ok) {
          throw new Error('Installation failed');
        }

        const data = await response.json();

        // Show success
        statusEl.className = 'status success';
        statusEl.textContent = '✅ Installation successful! Your AI agent is now active.';

        // Close Telegram WebApp
        if (tg) {
          tg.close();
        }

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 2000);

      } catch (error) {
        console.error('Installation error:', error);

        // Show error
        statusEl.className = 'status error';
        statusEl.textContent = '❌ Installation failed. Please try again.';

        btn.disabled = false;
        btn.innerHTML = '📥 Install Platform';
      }
    }
  </script>
</body>
</html>
